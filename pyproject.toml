[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-interrupt-engine"
version = "0.1.0"
description = "Spec-first reference for durable workflows with ephemeral cognition"
requires-python = ">=3.11"
authors = [{name = "Dan Voulez"}]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.26"]

[tool.pytest.ini_options]
pythonpath = ["src"]
